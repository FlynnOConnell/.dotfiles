# keybinds.yaml — single source of truth for the `kb` viewer.
#
# Each top-level key is a GROUP (an app/context). Each entry has:
#   keys : the key combo (shown + copied to clipboard on select)
#   desc : what it does
#   cat  : optional sub-group used for sorting/scanning within a group
#
# Add a binding = add one line. Example:
#   - { keys: "Super+x", desc: "do the thing", cat: "misc" }
#
# Reload is instant — `kb` re-reads this file every launch.

