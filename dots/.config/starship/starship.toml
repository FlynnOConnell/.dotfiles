# Starship Configuration - Nerd Font Symbols Preset
# Requires a Nerd Font installed and enabled in your terminal
"$schema" = 'https://starship.rs/config-schema.json'

# Increase timeout for slow commands (uv python can be slow on Windows)
command_timeout = 1000

[username]
show_always = true
format = "[$user]($style) in "
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$hostname]($style) "
style = "bold blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[directory]
truncation_length = 8
truncate_to_repo = false
read_only = " 󰌾"

[git_status]
# More readable git status symbols
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘"
format = '([\[$all_status$ahead_behind\]]($style) )'

