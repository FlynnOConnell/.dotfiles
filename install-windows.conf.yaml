# Windows Server Safe Configuration
# Excludes: komorebi, whkd, Linux-only tools (i3, polybar, etc.), .local/bin
# Run with: python dotbot/bin/dotbot -c install-windows.conf.yaml

- defaults:
    link:
      relink: true
      force: true
      create: true

- clean:
    ~/.config:
      recursive: true

- shell:
  -
    command: git submodule update --init --recursive
    description: Installing submodules
    stdout: true

- link:
    # Shell configuration
    ~/.bashrc:
      path: dots/.bashrc
    ~/.aliases:
      path: dots/.aliases

    # PowerShell profile (pwsh 7)
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1:
      path: dots/.config/powershell/profile.ps1

    # Neovim configuration (Windows uses $LOCALAPPDATA/nvim)
    # Points at the standalone kickstart.nvim repo (sibling of .dotfiles), not the
    # embedded snapshot in this repo, so nvim always tracks the current config.
    ~/AppData/Local/nvim:
      path: ~/repos/kickstart.nvim

    # Vim configurations
    ~/.vimrc:
      path: dots/.config/vim/.vimrc
    ~/.ideavimrc:
      path: dots/.ideavimrc

    # Development tools
    ~/.config/lazygit:
      path: dots/.config/lazygit
    # lazygit on Windows reads %LOCALAPPDATA%\lazygit, not ~/.config/lazygit
    ~/AppData/Local/lazygit/config.yml:
      path: dots/.config/lazygit/config.yml
    ~/.config/github-copilot:
      path: dots/.config/github-copilot

    # System monitoring (cross-platform)
    ~/.config/btop:
      path: dots/.config/btop

    # Editors
    ~/.config/micro:
      path: dots/.config/micro

    # Reference
    ~/.config/cheatsheets:
      path: dots/.config/cheatsheets

    # System info
    ~/.config/fastfetch:
      path: dots/.config/fastfetch

    # Shell prompt
    ~/.config/starship.toml:
      path: dots/.config/starship/starship.toml
