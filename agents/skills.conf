# Which skills get installed, and into which agents. Read by sync_skills.py.
# Comment a line out (or delete it) and re-run to uninstall that skill.
#
#   source <dir>   where skills live, searched in order. relative to agents/.
#                  missing dirs are skipped (e.g. omarchy's on Windows/servers).
#   agent <name>   install into this agent only (see `sync_skills.py --list`).
#                  unlisted agents get this script's skills and digest removed.
#   <name>         a skill directory inside one of the sources.
#
# Plugin-marketplace skills (fastplotlib, ...) aren't managed here; they're
# enabledPlugins in ~/.claude/settings.json (omarchy/.claude/settings.json).

source skills
source /usr/share/omarchy/default/agents/skills
source /home/fo/repos/runhub/skills

agent claude

# always on: inlined into the digest for agents without skill support
coding-style
workspace-conventions
data-management
runhub
deslop

# writing
manuscript-style
latex-manuscript
latex-pdf-preprocess
read-pdf-mineru

# python / science
script-opinions
figure-formatting
notebook-to-script
job-dispatch

# agent orchestration
manager
subagent-roles
keeping-memories

# apps
illustrator
imgui-layout

# explainers: the animation that describes, the page that is hands on
manim-animation
imgui-lesson

# omarchy
omarchy
diagnose-crash
